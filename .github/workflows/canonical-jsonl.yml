name: Canonical JSONL Hayabusa compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/validate_hayabusa.py'
      - '.github/workflows/canonical-jsonl.yml'

jobs:
  detections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: evtx
          lfs: true
      - uses: actions/checkout@v6
        with:
          repository: Yamato-Security/hayabusa
          ref: a5f0e010893a8c388e693019e3fbb8f374a9f9c0
          path: tools/hayabusa
          submodules: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            evtx
            tools/hayabusa
      - name: Build parser and run Rust tests
        working-directory: evtx
        run: |
          cargo test --locked
          cargo test --locked --manifest-path utf16-simd/Cargo.toml
          cargo build --release --locked --bin evtx_dump
      - name: Build unmodified Hayabusa
        working-directory: tools/hayabusa
        run: cargo build --release --locked
      - name: Require equivalent nonzero detections and metadata tolerance
        working-directory: evtx
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 scripts/validate_hayabusa.py --hayabusa ../tools/hayabusa --output "$RUNNER_TEMP/canonical/account"
          python3 scripts/validate_hayabusa.py --hayabusa ../tools/hayabusa --sample samples/system.evtx --output "$RUNNER_TEMP/canonical/system"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-jsonl-validation
          path: ${{ runner.temp }}/canonical
